name: Bug report
description: Report a reproducible problem in the site or synthetic harness fixture.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, cookies, customer data, ERP/QMS URLs, or real-work screenshots.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include synthetic input and commands that reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node version, and commit or release. Do not include usernames or hostnames.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste only logs with secrets, paths, identifiers, and work data removed.
