name: Quality

on:
  push:
    branches: [main]
    paths:
      - "agent-harness/**"
      - ".github/workflows/quality.yml"
      - ".github/dependabot.yml"
  pull_request:
    paths:
      - "agent-harness/**"
      - ".github/workflows/quality.yml"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-harness/requirements-fixture.txt
      - name: Install fixture dependencies
        run: python -m pip install -r agent-harness/requirements-fixture.txt
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Compile Python sources
        run: python -m compileall -q agent-harness
      - name: Run harness tests
        run: python -m unittest discover -s agent-harness/tests -p 'test_*.py'
      - name: Check whitespace
        run: git diff --check
